<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ShinOra Leagues</title>

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.logo{
font-size:56px;
font-weight:900;
line-height:.9;
color:#f97316;
margin-bottom:20px;
}

.scoreboard{
display:flex;
gap:12px;
margin-bottom:20px;
}

.card{
flex:1;
background:#1e293b;
padding:20px;
border-radius:20px;
text-align:center;
}

.score{
font-size:42px;
font-weight:900;
}

select{
width:100%;
padding:15px;
border-radius:15px;
border:none;
margin-bottom:15px;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
margin-bottom:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.brijen{
background:#f97316;
color:white;
}

.anushi{
background:#ec4899;
color:white;
}

.draw{
background:#facc15;
color:black;
}

.undo{
background:#ef4444;
color:white;
}

.feed{
margin-top:25px;
}

.match{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

h2{
margin-top:25px;
}

</style>

</head>
<body>

<div class="logo">
SHINORA<br>
LEAGUES
</div>

<div class="scoreboard">

<div class="card">
<div>Brijen</div>
<div class="score" id="brijenScore">0</div>
</div>

<div class="card">
<div>Anushi 👑</div>
<div class="score" id="anushiScore">0</div>
</div>

</div>

<select id="game">

<option>Mini Golf</option>
<option>Exploding Kittens</option>
<option>Thumb Fight</option>
<option>Sea Battle</option>
<option>Go Fish</option>
<option>4 in a Row</option>
<option>Match Monsters</option>
<option>Minesweepers</option>
<option>Brawl Bots</option>
<option>Disco-O</option>

</select>

<button class="brijen" onclick="submitWinner('Brijen')">
🏆 BRIJEN WON
</button>

<button class="anushi" onclick="submitWinner('Anushi')">
👑 ANUSHI WON
</button>

<button class="draw" onclick="submitWinner('Draw')">
🤝 DRAW
</button>

<button class="undo" onclick="undoMatch()">
🗑 UNDO LAST MATCH
</button>

<h2>Recent Battles</h2>

<div id="feed"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw-oJ1Y3nSj6rE2hcR3wOSbv1OsNSSbAh-Z-UUtnnm-oF5kmS3_Vql5RpPcsk-7mZtH/exec";

async function loadData(){

const res = await fetch(API_URL);
const data = await res.json();

document.getElementById("brijenScore").innerText =
data.brijen;

document.getElementById("anushiScore").innerText =
data.anushi;

const feed =
document.getElementById("feed");

feed.innerHTML = "";

data.recent.forEach(match=>{

feed.innerHTML += `
<div class="match">
🎮 ${match.game}<br>
🏆 ${match.winner}
</div>
`;

});

}

async function submitWinner(winner){

const game =
document.getElementById("game").value;

await fetch(API_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
game,
winner
})
});

setTimeout(loadData,1000);
}

async function undoMatch(){

if(!confirm("Undo last match?")) return;

await fetch(
API_URL + "?action=undo"
);

setTimeout(loadData,1000);
}

loadData();

</script>

</body>
</html>
