<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ShinOra Leagues</title>

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.logo{
font-size:56px;
font-weight:900;
line-height:.9;
color:#f97316;
margin-bottom:20px;
}

.scoreboard{
display:flex;
gap:12px;
margin-bottom:20px;
}

.card{
flex:1;
background:#1e293b;
padding:20px;
border-radius:20px;
text-align:center;
}

.score{
font-size:42px;
font-weight:900;
}

select{
width:100%;
padding:15px;
border-radius:15px;
border:none;
margin-bottom:15px;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
margin-bottom:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.brijen{
background:#f97316;
color:white;
}

.anushi{
background:#ec4899;
color:white;
}

.draw{
background:#facc15;
color:black;
}

.undo{
background:#ef4444;
color:white;
}

.feed{
margin-top:25px;
}

.match{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

h2{
margin-top:25px;
}

</style>

</head>
<body>

<div class="logo">
SHINORA<br>
LEAGUES
</div>

<div class="scoreboard">

<div class="card">
<div>Brijen 👑</div>
<div class="score" id="brijenScore">0</div>
</div>

<div class="card">
<div>Anushi 👑</div>
<div class="score" id="anushiScore">0</div>
</div>

</div>

<select id="game">

<option>Mini Golf</option>
<option>Blitz League</option>
<option>Exploding Kittens</option>
<option>Thumb Fight</option>
<option>Sea Battle</option>
<option>Go Fish</option>
<option>4 in a Row</option>
<option>Match Monsters</option>
<option>Minesweepers</option>
<option>Brawl Bots</option>
<option>Disco-O</option>
<option>Pool</option>
<option>Bowling</option>
<option>Table Soccer</option>
<option>Bounce</option>
<option>Carrom</option>
<option>Plox</option>
<option>Archery</option>
<option>Skeeball</option>
<option>Darts</option>
<option>Dots & Boxes</option>
<option>Basketball</option>
<option>Cup pong</option>
<option>Reversi</option>

</select>

<button class="brijen" onclick="submitWinner('Brijen')">
🏆 BRIJEN WON
</button>

<button class="anushi" onclick="submitWinner('Anushi')">
👑 ANUSHI WON
</button>

<button class="draw" onclick="submitWinner('Draw')">
🤝 DRAW
</button>

<button class="undo" onclick="undoMatch()">
🗑 UNDO LAST MATCH
</button>

<h2>Recent Battles</h2>

<div id="feed"></div>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzkcEdcyFO2wtHXymX3SgWzRZjyr4cfNSu44M_U8YO3jmf8RNhFXLEMRFoZCw1-WBs_/exec";

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    document.getElementById("brijenScore").innerText = data.brijen ?? 0;
    document.getElementById("anushiScore").innerText = data.anushi ?? 0;

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    if (data.recent && data.recent.length > 0) {
      data.recent.forEach(match => {
        feed.innerHTML += `
          <div class="match">
            🎮 ${match.game}<br>
            🏆 ${match.winner}
          </div>
        `;
      });
    }
  } catch (err) {
    console.error("Failed to load totals:", err);
  }
}

async function submitWinner(winner) {
  const game = document.getElementById("game").value;

  await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      game: game,
      winner: winner
    })
  });

  setTimeout(loadData, 1500);
}

async function undoMatch() {
  if (!confirm("Undo last match?")) return;

  await fetch(API_URL + "?action=undo");
  setTimeout(loadData, 1500);
}

loadData();
</script>

</body>
</html>
